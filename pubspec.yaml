name: cashtrack
description: CashTrack - Daily Expense Manager
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.5
  firebase_auth: ^5.3.3
  webview_flutter: ^4.10.0
  fl_chart: ^0.69.2
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  file_picker: ^10.3.6
  url_launcher: ^6.3.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  google_mobile_ads: ^9.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "cashtrack_logo.png"
  adaptive_icon_background: "#0B5D3B"
  adaptive_icon_foreground: "cashtrack_logo.png"

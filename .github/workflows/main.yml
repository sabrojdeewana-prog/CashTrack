name: Build CashTrack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Configure Firebase
        env:
          FIREBASE_ANDROID_JSON: ${{ secrets.FIREBASE_ANDROID_JSON }}
        run: |
          printf '%s' "$FIREBASE_ANDROID_JSON" > android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            sed -i '/plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
            sed -i '/plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release
      - name: Show APK SHA-1
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -i SHA1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CashTrack-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CashTrack-APK
          path: build/app/outputs/flutter-apk/app-release.apk

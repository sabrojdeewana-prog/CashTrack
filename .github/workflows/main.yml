name: Build CashTrack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Set Android compile SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk[[:space:]]*=.*/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle
          fi
      - name: Configure Firebase
        run: |
          git show HEAD:android/app/google-services.json > android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            sed -i '/plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
            sed -i '/plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle
          fi

      - name: Configure biometric authentication
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.USE_BIOMETRIC" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' "$MANIFEST"
          fi

          ACTIVITY=$(find android/app/src/main -type f \( -name "MainActivity.kt" -o -name "MainActivity.java" \) | head -1)
          if [[ "$ACTIVITY" == *.kt ]]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$ACTIVITY"
            sed -i 's/extends FlutterActivity/extends FlutterFragmentActivity/' "$ACTIVITY"
            sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$ACTIVITY"
          elif [[ "$ACTIVITY" == *.java ]]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity;/import io.flutter.embedding.android.FlutterFragmentActivity;/' "$ACTIVITY"
            sed -i 's/extends FlutterActivity/extends FlutterFragmentActivity/' "$ACTIVITY"
          fi

      - name: Get dependencies
        run: flutter pub get
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release
      - name: Show APK SHA-1
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CashTrack-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CashTrack-APK
          path: build/app/outputs/flutter-apk/app-release.apk
